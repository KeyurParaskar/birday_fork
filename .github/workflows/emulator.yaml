name: Emulator tests

# Runs the instrumented tests on a real Android emulator after every major update:
# each push to master or to a phase-* branch, each v* release tag, or on demand.
on:
  push:
    branches: [master, 'phase-*']
    tags: ['v*']
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app and the test APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run the tests on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Each line runs on its own; a failure is recorded so screenshots are still collected
          script: |
            ./gradlew connectedDebugAndroidTest || echo failed > emulator-tests-failed
            adb pull /sdcard/Pictures/AuspiceTests emulator-screenshots || true
            adb logcat -d > emulator-logcat.txt || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: emulator-screenshots
          if-no-files-found: warn

      - name: Upload test report and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: |
            app/build/reports/androidTests/connected
            emulator-logcat.txt
          if-no-files-found: warn

      - name: Fail if any emulator test failed
        run: test ! -f emulator-tests-failed
